name: bible

services:
  bible-reader:
    image: bible
    container_name: bible
    build:
      context: .
    ports:
      - "8834:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
